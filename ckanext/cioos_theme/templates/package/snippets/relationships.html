{% if relationships %}
<section class="relationships">
  <h3>{{ _('Related Works') }}</h3>
  <ul class="relationship-list">
    {% for rel in relationships %}
    <li class="relationship-item">
      <a class="relationship-link" href="{{ rel.object.url }}" target="_blank" rel="noopener">
        <span class="relationship-text">
          <span class="relationship-title">{{ h.scheming_language_text(rel.object.title) }}</span>
          <span class="visually-hidden">{{ _('(opens in a new tab)') }}</span>
          {% if rel.object.host %}
          <span class="relationship-host">
            <i class="fa fa-external-link" aria-hidden="true"></i>
            {{ rel.object.host }}
          </span>
          {% endif %}
        </span>
        <span class="relationship-type">{{ rel.type }}</span>
      </a>
    </li>
    {% endfor %}
  </ul>
</section>
{% endif %}
