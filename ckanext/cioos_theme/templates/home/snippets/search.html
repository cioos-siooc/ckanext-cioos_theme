{#
  Keyword search box for the home page hero (home/default_home.html).
  Styled by home.css.
#}
{% set placeholder = _('E.g. temperature') %}
<form class="home-search" role="search" method="get" action="{% url_for 'dataset.search' %}">
  <input
    aria-label="{% block header_site_search_label %}{{ _('Search datasets') }}{% endblock %}"
    id="field-main-search"
    type="search"
    class="home-search-input"
    name="q"
    value=""
    autocomplete="off"
    placeholder="{% block search_placeholder %}{{ placeholder }}{% endblock %}"
  />
  <button class="home-search-button" type="submit">
    <i class="fas fa-search" aria-hidden="true"></i>
    <span class="visually-hidden">{{ _('Search') }}</span>
  </button>
</form>
