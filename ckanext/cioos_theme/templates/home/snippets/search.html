{% set placeholder = _('E.g. temperature') %}

<h3 class="cioos-search heading">{{ _("Search By Keyword:") }}</h3>
<div class="module-content box">
  <form class="search-form" method="get" action="{% url_for controller='dataset', action='search' %}">
    <div class="col-md-3 col1"></div>
    <div class="col-md-6 col2 input-group search-input-group search-giant">
      <input aria-label="{% block header_site_search_label %}{{ _('Search datasets') }}{% endblock %}"
        id="field-main-search" type="text" class="form-control input-lg" name="q" value="" autocomplete="off"
        placeholder="{% block search_placeholder %}{{ placeholder }}{% endblock %}" />
      <button class="btn btn-default btn-lg" type="submit">
        <i class="fas fa-search"></i>
        <span class="visually-hidden">{{ _('Search') }}</span>
      </button>
    </div>
    <div class="col-md-3 col2"></div>
  </form>
</div>
