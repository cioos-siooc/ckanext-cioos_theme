cioos_theme_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_cioos_theme.css
  contents:
    - cioos_theme.css

bootstrap_datepicker_js:
  filter: rjsmin
  output: ckanext-cioos_theme/%(version)s_bootstrap_datepicker.js
  extra:
    preload:
      - base/main
      - vendor/font-awesome
      - vendor/jquery
  contents:
    - js/datepicker/bootstrap-datepicker.min.js
    - js/datepicker/bootstrap-datepicker.fr.min.js
    - js/modules/date-query.js

bootstrap_datepicker_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_bootstrap_datepicker.css
  contents:
    - js/datepicker/bootstrap-datepicker3.css

truncate_js:
  filter: rjsmin
  output: ckanext-cioos_theme/%(version)s_truncate.js
  extra:
    preload:
      - base/main
      - vendor/jquery
  contents:
    - js/modules/truncate.js

home_search_js:
  filter: rjsmin
  output: ckanext-cioos_theme/%(version)s_home_search.js
  extra:
    preload:
      - base/main
      - vendor/jquery
  contents:
    - js/modules/home-search.js

home_v2_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_home_v2.css
  contents:
    - home_v2.css

cioos-ai-chat-css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_cioos_ai_chat.css
  contents:
    - css/cioos_ai_chat.css

cioos-ai-chat-js:
  output: ckanext-cioos_theme/%(version)s_cioos_ai_chat.js
  contents:
    - js/cioos_ai_chat.js
