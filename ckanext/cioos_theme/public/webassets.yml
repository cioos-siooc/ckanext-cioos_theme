cioos_theme_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_cioos_theme.css
  contents:
    - cioos_theme.css

bootstrap_datepicker_js:
  filter: rjsmin
  output: ckanext-cioos_theme/%(version)s_bootstrap_datepicker.js
  extra:
    preload:
      - base/main
      - vendor/font-awesome
      - vendor/jquery
  contents:
    - js/datepicker/bootstrap-datepicker.min.js
    - js/datepicker/bootstrap-datepicker.fr.min.js
    - js/modules/date-query.js

bootstrap_datepicker_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_bootstrap_datepicker.css
  contents:
    - js/datepicker/bootstrap-datepicker3.css

truncate_js:
  filter: rjsmin
  output: ckanext-cioos_theme/%(version)s_truncate.js
  extra:
    preload:
      - base/main
      - vendor/jquery
  contents:
    - js/modules/truncate.js

home_search_js:
  filter: rjsmin
  output: ckanext-cioos_theme/%(version)s_home_search.js
  extra:
    preload:
      - base/main
      - vendor/jquery
  contents:
    - js/modules/home-search.js

home_v2_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_home_v2.css
  contents:
    - home_v2.css

home_v3_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_home_v3.css
  contents:
    - home_v3.css

home_v3_browse_filter_js:
  filter: rjsmin
  output: ckanext-cioos_theme/%(version)s_home_v3_browse_filter.js
  extra:
    preload:
      - base/main
      - vendor/jquery
  contents:
    - js/modules/home-v3-browse-filter.js

home_v3_map_js:
  filter: rjsmin
  output: ckanext-cioos_theme/%(version)s_home_v3_map.js
  extra:
    preload:
      - base/main
      - vendor/jquery
      # spatial_query_js bundles Leaflet 1.9.3 + leaflet.draw, which we need
      # for the bbox / polygon search-filter tools below.
      - ckanext-spatial/spatial_query_js
  contents:
    - js/markercluster/leaflet.markercluster.min.js
    # h3-js v4 UMD bundle (asm.js, no external .wasm). Exposes window.h3
    # with cellToBoundary / latLngToCell / polygonToCells used by the
    # hex-density layer in home-v3-map.js.
    - js/h3-js/h3-js.umd.js
    - js/modules/home-v3-map.js

home_v3_map_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_home_v3_map.css
  extra:
    preload:
      - ckanext-spatial/spatial_query_css
  contents:
    - js/markercluster/MarkerCluster.css
    - js/markercluster/MarkerCluster.Default.css

dataset_browser_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_dataset_browser.css
  contents:
    - dataset_browser.css

dataset_read_css:
  filters: cssrewrite
  output: ckanext-cioos_theme/%(version)s_dataset_read.css
  contents:
    - dataset_read.css

dataset_browser_js:
  filter: rjsmin
  output: ckanext-cioos_theme/%(version)s_dataset_browser.js
  extra:
    preload:
      - base/main
  contents:
    - js/modules/dataset-browser.js
