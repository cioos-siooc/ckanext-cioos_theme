[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ckanext-cioos_theme"
version = "1.6.2"
description = "CIOOS Custom Theme"
readme = "README.rst"
authors = [{ name = "Matthew Foster", email = "it.admin@cioos.org" }]
license = { text = "AGPL" }
keywords = ["CKAN", "CIOOS", "Theme"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.10"
# CKAN itself and the ckanext-* extensions this plugin works with (scheming,
# fluent, dcat, harvest) are installed by the deployment, not declared here.
dependencies = [
    "ckantoolkit",
    "jsonpickle",
    "lxml",
    "pyld",
    "rdflib",
    "requests",
    "shapely",
    "six",
]

[project.urls]
Homepage = "https://github.com/cioos-siooc/ckanext-cioos_theme"

[project.entry-points."ckan.plugins"]
cioos_theme = "ckanext.cioos_theme.plugin:Cioos_ThemePlugin"

[project.entry-points."babel.extractors"]
ckan = "ckan.lib.extract:extract_ckan"

[project.entry-points."ckan.rdf.profiles"]
cioos_dcat = "ckanext.cioos_theme.dcat.profiles:CIOOSDCATProfile"

[tool.setuptools.packages.find]
include = ["ckanext*"]
